name: marathondujeu
description: "Application de gestion des participants du Marathon du Jeu"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6
  google_fonts: ^8.2.1
  go_router: ^18.0.1
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  flex_color_picker: ^3.7.1  # 4.x est bâti sur material_ui, pas encore adopté ici (L05)
  pretty_qr_code: ^3.6.0
  uuid: ^4.6.0
  pdf: ^3.13.0
  printing: ^5.15.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.15.1
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  go_router_builder: ^4.5.0

flutter:
  generate: true
  uses-material-design: true
